# Netlify build, kept so a push still publishes dist until DNS moves.
# The live host is Cloudflare: wrangler.toml. The contact form and CMS
# login in this repo talk to /api/*, which only exists on Cloudflare.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects live in src/redirects.njk -> dist/_redirects (read directly by
# Netlify's edge; more reliable than netlify.toml for status=404 fallbacks).

# Long-cache fingerprinted assets (Eleventy Image filenames are content-hashed).
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
